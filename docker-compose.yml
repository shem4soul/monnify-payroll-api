# One command to run everything:  docker compose up --build
# Put your Monnify sandbox keys in .env first (copy .env.example). DATABASE_URL/REDIS_URL are overridden below.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
      POSTGRES_DB: payroll
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payroll -d payroll']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://payroll:payroll@postgres:5432/payroll
      REDIS_URL: redis://redis:6379
    command: sh -c "node dist/db/migrate.js && node dist/server.js"
    ports: ['3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://payroll:payroll@postgres:5432/payroll
      REDIS_URL: redis://redis:6379
    command: node dist/worker.js
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
